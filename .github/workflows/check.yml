name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication contents
        run: python scripts/check_release.py
      - name: Install CPU dependencies for isolated tests
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e ./vendor/whisperlivekit
      - name: Test synthetic inputs and temporary storage
        run: python -m pytest tests -q
